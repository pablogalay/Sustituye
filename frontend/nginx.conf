server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location = /index.html {
    try_files /index.html =404;
  }

  location /api/ {
    proxy_pass http://api:8000/;
    # The EducaMadrid sync endpoint drives real browser automation (SSO login +
    # LimeSurvey export) that can take a few minutes with retries; nginx's 60s
    # default would otherwise 504 the browser while the sync keeps running
    # server-side, showing a false error even though it later succeeds.
    proxy_connect_timeout 240s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
  }
}
